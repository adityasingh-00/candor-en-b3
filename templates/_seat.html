
<a
    href="{{ url_for('update', employee_id=emp.id) }}"
    class="seat {{ emp.view_status|lower }}"
    aria-label="Edit {{ emp.seat_no }} - {{ emp.name }} - {{ emp.view_status }}"
>

    <div class="seat-top">

        <span class="seat-number">
            {{ emp.seat_no }}
        </span>

        <span class="seat-indicator"></span>

    </div>

    <strong class="seat-name">
        {{ emp.name }}
    </strong>

    <span class="seat-status">
        {{ emp.view_status }}
    </span>

    {% if emp.view_replacement %}
        <span class="seat-replacement">
            Replacement: {{ emp.view_replacement }}
        </span>
    {% endif %}

    {% if emp.view_comment and emp.view_comment != emp.view_status %}
        <span class="seat-replacement">
            {{ emp.view_comment }}
        </span>
    {% endif %}

</a>
