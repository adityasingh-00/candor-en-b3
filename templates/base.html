<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173b65">
  <title>{% block title %}CANDOR Seat Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}" aria-label="Seat Tracker home">
      <span class="brand-mark">C</span>
      <span><strong>CANDOR</strong><small>Seating</small></span>
    </a>
    <div class="topbar-right">
      <span class="site-label">EN-B3 · SEATING</span>
    </div>
  </header>
  <main class="page">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-stack" aria-live="polite">
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">CANDOR · EN-B3 <span>All right reserved to EN-B3.</span></footer>
</body>
</html>
